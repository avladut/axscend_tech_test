name: axscend_tech_test_workspace
publish_to: none

environment:
  sdk: ^3.13.0

# Pub workspace: one dependency resolution and one pubspec.lock for every
# package below. Melos (configured at the bottom) runs commands across them.
workspace:
  - apps/axscend_tech_test
  - packages/app_ui
  - packages/domain
  - packages/jsonplaceholder_data
  - tool/ai_review
  - tool/coverage_gate

dev_dependencies:
  # Lets `dart run ai_review` work from the repo root. Dev tooling only:
  # the app never depends on it.
  ai_review:
    path: tool/ai_review
  # Lets `dart run coverage_gate` work from the repo root. Dev tooling too.
  coverage_gate:
    path: tool/coverage_gate
  # Pinned by pubspec.lock; a global `melos` switches to this version.
  melos: ^8.10.0
  very_good_analysis: ^11.0.0

melos:
  scripts:
    # `dart run melos` uses the pinned version, so no global install is needed
    # (Melos 8.10 steps only recognise some built-ins, e.g. not analyze/test).
    check:format:
      description: Fail if any Dart file isn't formatted.
      run: dart run melos format --set-exit-if-changed --output none
    check:analyze:
      description: Analyze every package. Infos and warnings fail the run.
      run: dart run melos analyze --no-pub
    check:test:
      description: >-
        Run every package's tests, each writing its coverage to
        coverage/lcov.info. Old reports are deleted first.
      steps:
        - test:clean
        - test:dart
        - test:flutter
    test:clean:
      description: Delete coverage reports from earlier runs.
      run: dart run melos exec -- rm -rf coverage
    test:dart:
      description: Test the pure Dart packages with coverage.
      run: >-
        dart run melos exec --no-flutter --dir-exists=test --
        dart test --coverage-path=coverage/lcov.info
    test:flutter:
      description: Test the Flutter packages with coverage.
      run: >-
        dart run melos exec --flutter --dir-exists=test --
        flutter test --coverage
    check:coverage:
      description: Fail unless each package covers at least 70% of its lines.
      run: dart run coverage_gate --min 70
    ci:
      description: Everything the CI pipeline runs, in the same order.
      steps:
        - check:format
        - check:analyze
        - check:test
        - check:coverage

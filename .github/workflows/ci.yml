name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the checks only need to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  # Format, analyze and the design-token check. Required on main.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a commit SHA, not a movable tag.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Fails if pubspec.lock is out of date, so CI never resolves new versions.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart run melos run check:format

      - name: Analyze
        run: dart run melos run check:analyze

      - name: Design tokens
        run: dart run melos run check:tokens

  # Every package's tests must pass, and each package must cover at least
  # 70% of its lines. Required on main.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run the tests, with coverage
        run: dart run melos run check:test

      # Writes the coverage table to this run's summary page.
      - name: Coverage of at least 70% per package
        run: dart run melos run check:coverage
